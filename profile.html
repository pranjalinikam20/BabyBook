<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baby Profile</title>
<link rel="stylesheet" href="profile.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <div class="page">
    <h1>Baby Profile</h1>
    <div class="subtitle">Tell us about your little one</div>

    <div class="card">
      <div class="avatar-box">
        <div class="avatar">
          👶
          <div class="camera-btn">📷</div>
        </div>
      </div>

      <div class="form-group">
        <label>Baby's Name</label>
        <input type="text" placeholder="Enter baby's name">
      </div>

      <div class="form-group">
        <label>Birth Date</label>
        <input type="date">
      </div>

      <div class="form-group">
        <label>Parent Names</label>
        <input type="text" placeholder="Enter parent names">
      </div>

      <div class="form-group">
        <label>Bio</label>
        <textarea placeholder="Share something special about your baby..."></textarea>
      </div>

      <button class="save-btn" href="dashboard.html">💾 Save Profile</button>
    </div>
  </div>
</body>
</html>
